site_name: LLM-notes
site_description: For recording useful knowledge about LLMs and computers.
site_url: https://wplf.github.io/LLM-notes/
repo_url: https://github.com/wplf/LLM-notes
repo_name: wplf/LLM-notes
edit_uri: edit/main/
# 笔记保留在仓库根目录的各主题文件夹中，CI 构建时会复制到 _docs/
docs_dir: _docs

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: 切换到深色模式 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: 切换到浅色模式 }

plugins:
  - search:
      lang: [zh, en]

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: { case: lower }
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.arithmatex: { generic: true }

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
